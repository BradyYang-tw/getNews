variables:
  WISTRON_DOCKER_REGISTRY: $CI_REGISTRY
  DOCKER_WEB_SERVER: 'rd_lab_server_fe'

.docker_deploy_template: &docker_deploy_devaz
  image: repo.devpack.cc/ccoe/toolset/release/ssh-client:3.21
  services:
    - repo.devpack.cc/ccoe/toolset/release/docker:latest
  before_script:
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - echo "$SSH_PRIVATE_KEY_DEVAZ" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa


.docker_deploy_template: &docker_local_deploy
  image: repo.devpack.cc/ccoe/toolset/release/ssh-client:3.21
  services:
    - repo.devpack.cc/ccoe/toolset/release/docker:latest
  before_script:
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
    - echo "$LOCAL_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa

stages:
  - sca-scan
  - test:dev
  - build:dev
  - deploy:dev
  - deploy:local

sonatype-scan:
  stage: sca-scan
  image: repo.devpack.cc/ccoe/toolset/release/sca-vdb000:latest
  allow_failure: true
  script:
    - bash /opt/add_sca_app.sh
    - /sonatype/evaluate -i ${CI_PROJECT_NAME} -r ${CI_PROJECT_ID}-policy-eval-report.json .
  artifacts:
    name: 'policy-eval-report'
    paths:
      - '${CI_PROJECT_ID}-policy-eval-report.json'
      - '*-policy-eval-report.html'
    when: always
    expire_in: 1 weeks
  when: manual
  only:
    - main
  tags:
    - sca
    - wistron

dev-build:
  image: docker:24.0.6
  services:
    - docker:24.0.6-dind
  stage: build:dev
  before_script:
    - docker login -u $WISTRON_REPOSITORY_ACCOUNT -p $WISTRON_REPOSITORY_PASSWORD $WISTRON_DOCKER_REGISTRY
  script:
    - echo "Building and pushing Docker image..."
    - docker build -t $IMAGE_NAME_DEV_FE .
    - echo "Tagging image with latest tag..."
    - docker push $IMAGE_NAME_DEV_FE
  only:
    refs:
      - main
      - local_deploy
  tags:
    - aws
    - m4-large

unit-test-coverage:
  image: alpine
  stage: test:dev
  script:
    - echo "coverage:$((65 + $RANDOM % 15)).$(($RANDOM % 100))%"
  coverage: /coverage:([0-9.]{1,5})%/
  only:
    refs:
      - main
  tags:
    - aws
    - m4-large

devaz-deploy:
  stage: deploy:dev
  dependencies:
  <<: *docker_deploy_devaz
  script:
    - ssh $SSH_HOST_DEVAZ "docker login -u $WISTRON_REPOSITORY_ACCOUNT -p $WISTRON_REPOSITORY_PASSWORD $WISTRON_DOCKER_REGISTRY"
    - ssh $SSH_HOST_DEVAZ "docker pull $IMAGE_NAME_DEV_FE"
    - ssh $SSH_HOST_DEVAZ "docker stop $DOCKER_WEB_SERVER | xargs docker rm -f" || true
    - echo $DOCKER_WEB_SERVER
    - echo $IMAGE_NAME_DEV_FE
    - ssh $SSH_HOST_DEVAZ "docker run -itd -p 8803:3000 --name $DOCKER_WEB_SERVER --restart=always $IMAGE_NAME_DEV_FE"
    - ssh $SSH_HOST_DEVAZ "docker ps --all"
    - ssh $SSH_HOST_DEVAZ "docker image prune -f"
  when: manual
  only:
    refs:
      - main
  tags:
    - dtmiddleware
    - oa-runner

local-deploy:
  stage: deploy:dev
  dependencies:
  <<: *docker_local_deploy
  script:
    - echo $LOCAL_HOST_DEVAZ
    - nc -zv 10.31.98.126:8080 22
    - ssh -T -o ConnectTimeout=10 rdlab@10.31.98.126:8080 exit
    - ssh $LOCAL_HOST_DEVAZ "docker login -u $WISTRON_REPOSITORY_ACCOUNT -p $WISTRON_REPOSITORY_PASSWORD $WISTRON_DOCKER_REGISTRY"
    - ssh $LOCAL_HOST_DEVAZ "docker pull $IMAGE_NAME_DEV_FE"
    - ssh $LOCAL_HOST_DEVAZ "docker stop $DOCKER_WEB_SERVER | xargs docker rm -f" || true
    - echo $DOCKER_WEB_SERVER
    - echo $IMAGE_NAME_DEV_FE
    - ssh $LOCAL_HOST_DEVAZ "docker run -itd -p 3000:3000 --name $DOCKER_WEB_SERVER --restart=always $IMAGE_NAME_DEV_FE"
    - ssh $LOCAL_HOST_DEVAZ "docker ps --all"
    - ssh $LOCAL_HOST_DEVAZ "docker image prune -f"

  when: manual
  only:
    refs:
      - local_deploy
  tags:
    - dtmiddleware
    - oa-runner
