## Gen Log4j configuration file
# This file is used to configure logging for the application.
Configuration:
  Appenders:
    Console:
      name: CONSOLE
      PatternLayout:
        pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS}${LOG_LEVEL_PATTERN:-%5p} [PID:%pid] --- [%15.15t] %-50.50c{1.3*} : %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"
    File:
      name: FILE
      fileName: logs/application.log
      PatternLayout:
        pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS}${LOG_LEVEL_PATTERN:-%5p} [PID:%pid] --- [%15.15t] %-50.50c{1.3*} : %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"
  Loggers:
    Root:
      level: INFO
      AppenderRef:
        - ref: CONSOLE
        - ref: FILE