databaseChangeLog:
  - changeSet:
      id: 001-create-users-table
      author: brady
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: account
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(100)

              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP

  - changeSet:
      id: 002-insert-test-user
      author: brady
      changes:
        - insert:
            tableName: users
            columns:
              - column:
                  name: account
                  value: admin
              - column:
                  name: password
                  value: "123456"
              - column:
                  name: name
                  value: 管理員
              - column:
                  name: enabled
                  valueBoolean: true