## Sample Profile
spring:
  config:
    activate:
      on-profile: sample
  liquibase:
    enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sample
    password: sample
  h2:
    console:
      enabled: true
      path: /h2-console

# Server Configuration
server_ip: ${server_ip}

## DB Configuration
db_classname: org.h2.Driver
db_url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
db_username: sample
db_password: sample

## Swagger Configuration
springdoc:
  swagger-ui:
    enabled: true
