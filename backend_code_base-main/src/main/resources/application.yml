## Common Profile
server:
  port: 8090

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://sts.windows.net/de0795e0-d7c0-4eeb-b9bb-bc94d8980d3b/
      client:
        registration:
          sfs:
            authorization-grant-type: client_credentials
            client-id: ${oauth2_client_id}
            client-secret: ${oauth2_client_secret}
            scope: api://${oauth2_client_id}/.default
        provider:
          sfs:
            token-uri: https://login.microsoftonline.com/de0795e0-d7c0-4eeb-b9bb-bc94d8980d3b/oauth2/v2.0/token

## DB Configuration
db_classname: org.postgresql.Driver
db_schema: topology

## Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: info, health
  endpoint:
    health:
      show-details: always
  health:
    probes:
      enabled: true
---
## DEV Profile
spring:
  config:
    activate:
      on-profile: dev
  liquibase:
    enabled: true

# Server Configuration
server_ip: ${server_ip}

## Swagger Configuration
springdoc:
  swagger-ui:
    enabled: true

